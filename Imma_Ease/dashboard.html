<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Immaculate · Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e6ecf3 100%);
            color: #0a1e2f;
            min-height: 100vh;
            padding: 10px 32px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('image/Immaculate-removebg-preview.png');
            background-repeat: no-repeat;
            background-position: center 140px;
            background-size: 40%;
            opacity: 0.7;  
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(10, 30, 60, 0.02) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 2000px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ---------- HEADER — NAVY BLUE WITH 3-COLUMN LAYOUT ---------- */
        header {
            background: #000080;
            color: white;
            padding: 16px 28px;
            margin-bottom: 40px;
            border-radius: 20px;
            box-shadow: 
                0 10px 25px -5px rgba(59, 130, 246, 0.3),
                0 8px 10px -6px rgba(59, 130, 246, 0.2);
            position: relative;
            overflow: hidden;
        }

        .header-content {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
        }

        /* LEFT COLUMN - Welcome & User */
        .user-greeting {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 20px 8px 24px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: auto;
            justify-self: start;
        }

        .greeting-text {
            display: flex;
            flex-direction: column;
        }

        .welcome-label {
            font-size: 0.8rem;
            opacity: 0.8;
            letter-spacing: 0.3px;
        }

        .user-name {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .role-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
            white-space: nowrap;
        }

        /* CENTER COLUMN - Branding */
        .branding {
            text-align: center;
            justify-self: center;
        }

        .branding h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            color: white;
            line-height: 1.2;
            text-shadow: 0 2px 3px rgba(0,0,0,0.1);
        }

        .branding div {
            font-size: 0.9rem;
            font-weight: 400;
            opacity: 0.85;
            color: rgba(255,255,255,0.9);
            letter-spacing: 0.5px;
        }

        /* RIGHT COLUMN - Date/Time & Logout */
        .session-info {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 20px;
            justify-self: end;
        }

        .datetime {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            text-align: right;
        }

        .date {
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .time {
            font-size: 0.85rem;
            opacity: 0.9;
            font-weight: 500;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 22px;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 8px 14px -6px rgba(0,0,0,0.25);
        }

        /* ---------- DASHBOARD GRID ---------- */
        .systems-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
            position: relative;
            z-index: 20;
        }

        .system-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 30px;
            padding: 36px 28px 32px;
            transition: all 0.35s cubic-bezier(0.2, 0, 0, 1);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 18px -6px rgba(0, 35, 55, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .system-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 25px 30px -12px rgba(10, 45, 90, 0.2);
            background: rgba(255, 255, 255, 0.98);
        }

        .system-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
        }

        .system-card.reservation::after {
            background: linear-gradient(90deg, #50C878);
        }
        .system-card.reservation .icon {
            background: linear-gradient(145deg, #fff0eb, #ffe6dd);
            color: #c24a2a;
            box-shadow: 0 6px 14px rgba(255, 126, 95, 0.1);
        }
        .system-card.reservation:hover {
            background: rgba(255, 250, 248, 0.98);
        }

        .system-card.profiling::after {
            background: linear-gradient(90deg, #2e48cc);
        }
        .system-card.profiling .icon {
            background: linear-gradient(145deg, #e8f8ec, #daf4e0);
            color: #1e7b4c;
            box-shadow: 0 6px 14px rgba(46, 204, 113, 0.1);
        }
        .system-card.profiling:hover {
            background: rgba(240, 253, 244, 0.98);
        }

        .system-card.documents::after {
            background: linear-gradient(90deg, #f39c12, #f7b731);
        }
        .system-card.documents .icon {
            background: linear-gradient(145deg, #fff3e0, #ffedd0);
            color: #b85e00;
            box-shadow: 0 6px 14px rgba(243, 156, 18, 0.1);
        }
        .system-card.documents:hover {
            background: rgba(255, 249, 236, 0.98);
        }

        .system-card.users::after {
            background: linear-gradient(90deg, #9b59b6, #c97ddb);
        }
        .system-card.users .icon {
            background: linear-gradient(145deg, #f5ecf9, #f0e4fa);
            color: #6c3483;
            box-shadow: 0 6px 14px rgba(155, 89, 182, 0.1);
        }
        .system-card.users:hover {
            background: rgba(251, 244, 255, 0.98);
        }

        .system-card.audit::after {
            background: linear-gradient(90deg, #dc3545, #ff6b6b);
        }
        .system-card.audit .icon {
            background: linear-gradient(145deg, #fff0f0, #ffe6e6);
            color: #dc3545;
            box-shadow: 0 6px 14px rgba(220, 53, 69, 0.1);
        }
        .system-card.audit:hover {
            background: rgba(255, 240, 240, 0.98);
        }

        .system-card .icon {
            font-size: 3.8rem;
            margin-bottom: 20px;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            transition: transform 0.3s ease, box-shadow 0.2s;
            box-shadow: 0 10px 20px -10px rgba(0,0,0,0.04);
        }

        .system-card:hover .icon {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 15px 25px -12px rgba(0,0,0,0.1);
        }

        .system-card h3 {
            font-size: 1.55rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #0a1e3c;
            letter-spacing: -0.01em;
        }

        .system-card p {
            color: #546e7a;
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 240px;
            margin: 0 auto;
            font-weight: 400;
        }

        /* ---------- FOOTER ---------- */
        .footer-seal {
            margin-top: auto;
            background: #000080;
            border-radius: 100px;
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px -8px rgba(10, 30, 60, 0.2);
            width: 100%;
            position: relative;
            z-index: 20;
            backdrop-filter: blur(4px);
        }

        .seal-content {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .seal-divider {
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        .seal-icon {
            font-size: 1.3rem;
            opacity: 0.9;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
        }

        .footer-right {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
            opacity: 0.8;
            color: rgba(255,255,255,0.9);
        }

        .footer-right span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 1000px) {
            .header-content {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .user-greeting {
                justify-content: center;
            }
            .session-info {
                justify-content: center;
            }
        }

        @media (max-width: 800px) {
            body { padding: 10px 20px; }
            body::before { background-size: 70%; opacity: 0.07; }
            .branding h1 { font-size: 1.6rem; }
            .footer-seal { 
                flex-direction: column; 
                align-items: flex-start; 
                gap: 16px; 
                border-radius: 40px; 
            }
            .seal-content { gap: 12px; }
        }

        @media (max-width: 500px) {
            .user-greeting, .session-info {
                flex-wrap: wrap;
                justify-content: flex-start;
            }
            .systems-grid { gap: 20px; }
        }

        /* ---------- ANIMATIONS ---------- */
        .system-card {
            opacity: 0;
            animation: fadeSlideUp 0.4s ease forwards;
        }
        .system-card:nth-child(1) { animation-delay: 0.05s; }
        .system-card:nth-child(2) { animation-delay: 0.1s; }
        .system-card:nth-child(3) { animation-delay: 0.15s; }
        .system-card:nth-child(4) { animation-delay: 0.2s; }
        .system-card:nth-child(5) { animation-delay: 0.25s; }

        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER — 3-COLUMN LAYOUT: Welcome | Branding | Date/Time + Logout -->
        <header>
            <div class="header-content">
                <!-- LEFT: Welcome & User -->
                <div class="user-greeting">
                    <span class="greeting-text">
                        <span class="welcome-label">WELCOME</span>
                        <span class="user-name" id="userFullName">User</span>
                    </span>
                    <span class="role-badge" id="userRole">ROLE</span>
                </div>
                
                <!-- CENTER: Branding -->
                <div class="branding">
                    <h1>Barangay Immaculate</h1>
                    <div>Management System Dashboard</div>
                </div>
                
                <!-- RIGHT: Date/Time + Logout -->
                <div class="session-info">
                    <div class="datetime">
                        <div class="date" id="currentDate"></div>
                        <div class="time" id="currentTime"></div>
                    </div>
                    <button class="logout-btn" onclick="logout()">
                        <span style="font-size:1.1rem;">↪</span> Logout
                    </button>
                </div>
            </div>
        </header>

        <!-- DYNAMIC CARDS GRID -->
        <div class="systems-grid" id="systemsGrid"></div>

        <!-- FOOTER -->
        <div class="footer-seal">
            <div class="seal-content">
                <span class="seal-icon">🏛️</span>
                <span style="font-weight: 600; letter-spacing: 0.5px;">Barangay Immaculate</span>
                <span class="seal-divider"></span>
                <span>DIST. IV</span>
                <span class="seal-divider"></span>
                <span>NCR</span>
                <span class="seal-divider"></span>
                <span style="font-weight: 600;">2026</span>
                <span class="seal-divider"></span>
                <span style="opacity: 0.9;">🇵🇭</span>
            </div>
            <div class="footer-right">
                <span>⦿ Systems Plus Computer College</span>
                <span>⦿ v1.0</span>
            </div>
        </div>
    </div>

    <script src="/Imma_Ease/api/audit/audit_logger.js"></script>

    <script>
        // -----------------------------------------------------
        // LIVE DATE & TIME + USER AUTHENTICATION
        // -----------------------------------------------------
        document.addEventListener('DOMContentLoaded', async function() {
            const user = JSON.parse(localStorage.getItem('user'));
            
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            // Display user full name
            document.getElementById('userFullName').textContent = user.full_name || 'User';

            // Customize role display
            let displayRole = user.role.toUpperCase();
            if (displayRole === 'SUPER_ADMIN') {
                displayRole = 'ADMIN';
            } else if (displayRole === 'ADMIN') {
                displayRole = 'STAFF';
            }
            document.getElementById('userRole').textContent = displayRole;
            
            // Check if staff has audit access
            let hasAuditAccess = false;
            if (user.role === 'super_admin') {
                hasAuditAccess = true; // Admin always has access
            } else {
                // Check if staff has been granted permission
                hasAuditAccess = await checkAuditPermission(user.id);
            }
            
            // Load system cards based on role and audit access
            loadSystems(user.role, hasAuditAccess);
            
            // Initialize live date and time
            updateDateTime();
            setInterval(updateDateTime, 1000);
        });

        // Function to check if staff has audit permission
        async function checkAuditPermission(userId) {
            try {
                const response = await fetch(`/Imma_Ease/api/audit/check_permission.php?user_id=${userId}`);
                const data = await response.json();
                return data.has_permission || false;
            } catch (error) {
                console.warn('Error checking audit permission:', error);
                return false;
            }
        }

        // Live date/time update function
        function updateDateTime() {
            const now = new Date();
            
            // Format: Tue Feb 11, 2026
            const dateOptions = { 
                weekday: 'short', 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', dateOptions);
            
            // Format: 14:32:45 (24-hour format)
            const timeOptions = { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: false 
            };
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('en-US', timeOptions);
        }

        function loadSystems(role, hasAuditAccess) {
            const systemsGrid = document.getElementById('systemsGrid');
            const systems = [
                {
                    id: 'reservation',
                    title: 'Facility Reservation',
                    description: 'Manage facility bookings and reservations',
                    icon: '🏟️',
                    file: 'reservation.html'
                },
                {
                    id: 'profiling',
                    title: 'Resident Profiling',
                    description: 'Manage resident information and records',
                    icon: '👥',
                    file: 'profiling.html'
                },
                {
                    id: 'documents',
                    title: 'Document Processing',
                    description: 'Generate barangay certificates and documents',
                    icon: '📄',
                    file: 'documents.html'
                }
            ];
            
            // Add User Management for super_admin only
            if (role === 'super_admin') {
                systems.push({
                    id: 'users',
                    title: 'User Management',
                    description: 'Manage system users and permissions',
                    icon: '👨‍💼',
                    file: 'user_management.html'
                });
            }
            
            // Add Audit Log for:
            // - super_admin (always)
            // - staff with permission (hasAuditAccess = true)
            if (role === 'super_admin' || hasAuditAccess) {
                systems.push({
                    id: 'audit',
                    title: 'Audit Logs',
                    description: role === 'super_admin' 
                        ? 'View all system activities (Admin Access)' 
                        : 'View system activities (Granted Access)',
                    icon: '📋',
                    file: 'audit_viewer.html'
                });
            }
            
            systemsGrid.innerHTML = systems.map(system => `
                <div class="system-card ${system.id}" onclick="navigateTo('${system.file}')">
                    <div class="icon">${system.icon}</div>
                    <h3>${system.title}</h3>
                    <p>${system.description}</p>
                </div>
            `).join('');
        }

        function navigateTo(file) {
            window.location.href = file;
        }
        
        function logout() {
            // Log the logout action
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                Audit.log('LOGOUT', 'AUTH', {
                    username: user?.username,
                    user_id: user?.id
                });
            } catch (e) {
                console.warn('Logout audit failed:', e);
            }
            
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
